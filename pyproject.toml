[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "br-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for BR (Bayerischer Rundfunk) — ticker, news by category, search, article text, radio stories and traffic via the official RSS feeds"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
br-mcp = "br_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/br_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real www.br.de/nachrichtenfeeds.br.de feeds"]
